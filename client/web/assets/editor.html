<!-- web/assets/editor.html -->
<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #editor {
            padding: 12px;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
        }
    </style>
</head>

<body>
    <div id="editor" contenteditable="true">Start typing...</div>

    <script>
        window.setLineHeight = function (value) {
            document.getElementById("editor").style.lineHeight = value;
        };

        window.setFontSize = function (value) {
            document.getElementById("editor").style.fontSize = value;
        };

        window.setParagraphSpacing = function (value) {
            document.querySelectorAll("#editor p").forEach((p) => {
                p.style.marginBottom = value;
            });
        };

        window.getEditorContent = function () {
            return document.getElementById("editor").innerHTML;
        };
    </script>
</body>

</html>
