version: "3.8"

services:
  mysql-db:
    image: mysql:8.0
    container_name: binarysuccess-mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123
      MYSQL_DATABASE: binary_success
      MYSQL_USER: bsadmin
      MYSQL_PASSWORD: BsAdmin123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: binarysuccess-api-local
    ports:
      - "8000:8000"
    env_file:
      - ../.env.local
    depends_on:
      mysql-db:
        condition: service_healthy
    volumes:
      - ../app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql-data:
